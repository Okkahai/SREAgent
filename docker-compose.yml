name: opspilot

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-opspilot}:${POSTGRES_PASSWORD:-opspilot_dev_password}@postgres:5432/${POSTGRES_DB:-opspilot}
  REDIS_URL: redis://redis:6379/0
  OPSPILOT_ENV: ${OPSPILOT_ENV:-dev}
  OPSPILOT_LOG_LEVEL: ${OPSPILOT_LOG_LEVEL:-INFO}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OPSPILOT_ACTIONS_ENABLED: ${OPSPILOT_ACTIONS_ENABLED:-false}
  OPSPILOT_INGEST_TOKEN: ${OPSPILOT_INGEST_TOKEN:-dev-ingest-token}
  DETECTION_RECOVERY_MINUTES: ${DETECTION_RECOVERY_MINUTES:-10}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5-5}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opspilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opspilot_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-opspilot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opspilot} -d ${POSTGRES_DB:-opspilot}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel/collector.yaml"]
    environment:
      OPSPILOT_INGEST_TOKEN: ${OPSPILOT_INGEST_TOKEN:-dev-ingest-token}
    volumes:
      - ./deploy/otel/collector.yaml:/etc/otel/collector.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  api:
    build: ./backend
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn opspilot.main:app --host 0.0.0.0 --port 8000"]
    environment: *backend-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: ./backend
    command: ["celery", "-A", "opspilot.workers.celery_app", "worker", "-l", "info", "-Q", "default"]
    environment: *backend-env
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}

  beat:
    build: ./backend
    command: ["celery", "-A", "opspilot.workers.celery_app", "beat", "-l", "info", "-s", "/tmp/celerybeat-schedule"]
    environment: *backend-env
    depends_on:
      redis: {condition: service_healthy}

  web:
    build: ./web
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api: {condition: service_healthy}

  # ---- Demo application (Phase 2): docker compose --profile demo up ----
  shop-db:
    profiles: [demo]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  payments:
    profiles: [demo]
    build: ./demo/shop
    command: ["uvicorn", "shop.payments:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: &demo-env
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      DEPLOY_ENV: demo
      SERVICE_VERSION: ${PAYMENTS_VERSION:-1.0.0}
      COMMIT_SHA: ${PAYMENTS_COMMIT:-unknown}
    ports:
      - "127.0.0.1:8082:8000"
    depends_on:
      otel-collector: {condition: service_started}

  checkout:
    profiles: [demo]
    build: ./demo/shop
    command: ["uvicorn", "shop.checkout:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *demo-env
      SERVICE_VERSION: ${CHECKOUT_VERSION:-1.0.0}
      COMMIT_SHA: ${CHECKOUT_COMMIT:-unknown}
      # The knob a "bad deployment" changes (scripts/deploy.sh bad).
      DB_POOL_SIZE: ${CHECKOUT_DB_POOL_SIZE:-20}
      SHOP_DATABASE_URL: postgresql+psycopg://shop:shop@shop-db:5432/shop
      PAYMENTS_URL: http://payments:8000
    ports:
      - "127.0.0.1:8081:8000"
    depends_on:
      shop-db: {condition: service_healthy}
      payments: {condition: service_started}

  gateway:
    profiles: [demo]
    build: ./demo/shop
    command: ["uvicorn", "shop.gateway:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *demo-env
      SERVICE_VERSION: ${GATEWAY_VERSION:-1.0.0}
      COMMIT_SHA: ${GATEWAY_COMMIT:-unknown}
      CHECKOUT_URL: http://checkout:8000
    ports:
      - "127.0.0.1:8080:8000"
    depends_on:
      checkout: {condition: service_started}

  loadgen:
    profiles: [demo]
    build: ./demo/shop
    command: ["python", "-m", "shop.loadgen"]
    environment:
      TARGET_URL: http://gateway:8000
      LOAD_RPS: ${LOAD_RPS:-30}
    depends_on:
      gateway: {condition: service_started}

volumes:
  pgdata:
