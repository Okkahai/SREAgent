apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: opspilot
resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - redis.yaml
  - migrate.yaml
  - api.yaml
  - worker.yaml
  - web.yaml
  - otel-collector.yaml
  - network-policies.yaml
configMapGenerator:
  - name: otel-collector-config
    files:
      # Single source of truth shared with docker compose. Render with
      # `kubectl kustomize --load-restrictor=LoadRestrictionsNone` (see `make k8s-render`).
      - collector.yaml=../../otel/collector.yaml
generatorOptions:
  disableNameSuffixHash: true
labels:
  - pairs: {app.kubernetes.io/part-of: opspilot}
