apiVersion: v1
kind: ServiceAccount
metadata:
  name: migrate
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        opspilot.io/role: backend
    spec:
      restartPolicy: OnFailure
      serviceAccountName: migrate
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: opspilot/backend
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: {name: opspilot-config}
            - secretRef: {name: opspilot-secrets}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
