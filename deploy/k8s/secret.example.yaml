# Create the real Secret out of band (kubectl, External Secrets, Sealed Secrets, ...). Never commit
# real values. Only the first five keys are required.
apiVersion: v1
kind: Secret
metadata:
  name: opspilot-secrets
  namespace: opspilot
type: Opaque
stringData:
  POSTGRES_USER: opspilot
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: postgresql+psycopg://opspilot:change-me@postgres:5432/opspilot
  OPSPILOT_INGEST_TOKEN: change-me
  OPSPILOT_APPROVER_TOKEN: change-me
  # Optional: ANTHROPIC_API_KEY, GITHUB_TOKEN, GITHUB_REPO, GITHUB_WEBHOOK_SECRET, GITHUB_WRITE_TOKEN
