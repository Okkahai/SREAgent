# Demo shop (Phase 2) as a Kustomize component: gateway -> checkout -> payments/shop-db, plus load.
apiVersion: v1
kind: ServiceAccount
metadata: {name: shop-db}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: shop-db}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: shop-db}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: shop-db}
    spec:
      serviceAccountName: shop-db
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: shop-db
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: shop}
            - {name: POSTGRES_PASSWORD, value: shop}
            - {name: POSTGRES_DB, value: shop}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports: [{name: pg, containerPort: 5432}]
          readinessProbe:
            exec: {command: [sh, -c, "pg_isready -U shop -d shop"]}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: shop-db}
spec:
  selector: {app.kubernetes.io/name: shop-db}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: payments}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: payments}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: payments}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments
        opspilot.io/telemetry-source: "true"
    spec:
      serviceAccountName: payments
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: payments
          image: opspilot/demo-shop
          args: ["uvicorn", "shop.payments:app", "--host", "0.0.0.0", "--port", "8000"]
          env:
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318"}
            - {name: DEPLOY_ENV, value: demo}
            - {name: SERVICE_VERSION, value: "1.0.0"}
            - {name: COMMIT_SHA, value: unknown}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: payments}
spec:
  selector: {app.kubernetes.io/name: payments}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: v1
