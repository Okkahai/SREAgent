apiVersion: v1
kind: ServiceAccount
metadata: {name: loadgen}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: loadgen}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: loadgen}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadgen
        opspilot.io/telemetry-source: "true"
    spec:
      serviceAccountName: loadgen
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: loadgen
          image: opspilot/demo-shop
          args: ["python", "-m", "shop.loadgen"]
          env:
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318"}
            - {name: DEPLOY_ENV, value: demo}
            - {name: SERVICE_VERSION, value: "1.0.0"}
            - {name: COMMIT_SHA, value: unknown}
            - {name: TARGET_URL, value: "http://gateway:8000"}
            - {name: LOAD_RPS, value: "30"}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
---
# Demo traffic flows. shop-db has no telemetry, so it is not a telemetry source.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: demo-shop-flows}
spec:
  podSelector: {matchLabels: {opspilot.io/telemetry-source: "true"}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {opspilot.io/telemetry-source: "true"}}}]
      ports: [{protocol: TCP, port: 8000}]
  egress:
    - to: [{podSelector: {matchLabels: {opspilot.io/telemetry-source: "true"}}}]
      ports: [{protocol: TCP, port: 8000}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: shop-db}}}]
      ports: [{protocol: TCP, port: 5432}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: otel-collector}}}]
      ports: [{protocol: TCP, port: 4318}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: shop-db-from-checkout}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: shop-db}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: checkout}}}]
      ports: [{protocol: TCP, port: 5432}]
