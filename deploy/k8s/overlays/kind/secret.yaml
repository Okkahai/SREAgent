# Development values only. Real environments create this Secret out of band.
apiVersion: v1
kind: Secret
metadata:
  name: opspilot-secrets
type: Opaque
stringData:
  POSTGRES_USER: opspilot
  POSTGRES_PASSWORD: opspilot_dev_password
  DATABASE_URL: postgresql+psycopg://opspilot:opspilot_dev_password@postgres:5432/opspilot
  OPSPILOT_INGEST_TOKEN: dev-ingest-token
  OPSPILOT_APPROVER_TOKEN: dev-approver-token
