# Receives OTLP from applications, exports to the OpsPilot ingest API (Phase 3)
# and keeps the debug exporter so telemetry is visible in collector logs.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch: {}

exporters:
  debug:
    verbosity: basic
  otlphttp/opspilot:
    endpoint: http://api:8000/v1/otlp
    compression: gzip
    headers:
      Authorization: "Bearer ${env:OPSPILOT_INGEST_TOKEN}"
    retry_on_failure:
      enabled: true
      max_elapsed_time: 120s

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlphttp/opspilot]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlphttp/opspilot]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlphttp/opspilot]
