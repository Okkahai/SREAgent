name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot_dev_password
          POSTGRES_DB: opspilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opspilot" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: lint-imports
      - name: Tests (unit + integration against real Postgres/Redis)
        env:
          INTEGRATION: "1"
          DATABASE_URL: postgresql+psycopg://opspilot:opspilot_dev_password@localhost:5432/opspilot
          REDIS_URL: redis://localhost:6379/0
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config -q
      - name: Bring up stack and smoke test
        run: |
          docker compose up -d --build --wait --wait-timeout 240
          curl -fsS localhost:8000/healthz
          curl -fsS localhost:8000/readyz
          curl -fsS -o /dev/null localhost:3000
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down -v

  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Start API and web (real Postgres, Redis, migrations)
        run: docker compose up -d --build --wait --wait-timeout 300 postgres redis api web
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
        env:
          OPSPILOT_INGEST_TOKEN: dev-ingest-token
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down -v

  k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render and validate manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          kubectl kustomize --load-restrictor=LoadRestrictionsNone deploy/k8s/overlays/kind > rendered.yaml
          ./kubeconform -strict -summary rendered.yaml

  kind-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: opspilot
      - name: Build images, load into kind, deploy with Kustomize
        run: |
          docker build -q -t opspilot/backend:ci backend
          docker build -q -t opspilot/web:ci web
          docker build -q -t opspilot/demo-shop:ci demo/shop
          kind load docker-image --name opspilot opspilot/backend:ci opspilot/web:ci opspilot/demo-shop:ci
          ./scripts/kind.sh deploy
      - name: Failure-injection scenario on Kubernetes
        run: ./scripts/kind.sh check
      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl -n opspilot get pods -o wide
          kubectl -n opspilot describe pods | tail -150
          for d in api worker beat otel-collector checkout; do echo "== $d"; kubectl -n opspilot logs deployment/$d --tail=80 || true; done
          kubectl -n opspilot logs job/migrate --tail=50 || true

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: echo DETECTION_RECOVERY_MINUTES=1 >> .env
      - name: Start stack with demo profile
        run: docker compose --profile demo up -d --build --wait --wait-timeout 300
      - name: Failure-injection check (healthy, faults, bad deploy, recovery, telemetry)
        run: ./scripts/demo_check.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose --profile demo logs --no-color --tail=200
      - if: always()
        run: docker compose --profile demo down -v

  demo-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/shop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit (backend and demo dependencies)
        run: |
          python -m pip install -U pip setuptools wheel pip-audit
          pip install ./backend ./demo/shop
          pip-audit --skip-editable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Next 15 bundles a postcss build-time advisory whose fix needs Next 16; only critical gates.
      - run: npm ci && npm audit --omit=dev --audit-level=critical
        working-directory: web
      - name: Render manifests
        run: |
          mkdir -p /tmp/rendered && kubectl kustomize --load-restrictor=LoadRestrictionsNone deploy/k8s/overlays/kind > /tmp/rendered/all.yaml
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: /tmp/rendered
          severity: HIGH,CRITICAL
          exit-code: "1"

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
