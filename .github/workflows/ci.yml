name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot_dev_password
          POSTGRES_DB: opspilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opspilot" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Tests (unit + integration against real Postgres/Redis)
        env:
          INTEGRATION: "1"
          DATABASE_URL: postgresql+psycopg://opspilot:opspilot_dev_password@localhost:5432/opspilot
          REDIS_URL: redis://localhost:6379/0
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config -q
      - name: Bring up stack and smoke test
        run: |
          docker compose up -d --build --wait --wait-timeout 240
          curl -fsS localhost:8000/healthz
          curl -fsS localhost:8000/readyz
          curl -fsS -o /dev/null localhost:3000
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down -v

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Start stack with demo profile
        run: docker compose --profile demo up -d --build --wait --wait-timeout 300
      - name: Failure-injection check (healthy, faults, bad deploy, recovery, telemetry)
        run: ./scripts/demo_check.sh
      - name: Dump logs on failure
        if: failure()
        run: docker compose --profile demo logs --no-color --tail=200
      - if: always()
        run: docker compose --profile demo down -v

  demo-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/shop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
